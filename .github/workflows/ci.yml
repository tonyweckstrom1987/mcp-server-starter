name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - name: Aseta Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Asenna riippuvuudet
        run: npm ci

      - name: Tarkista tuotantoriippuvuuksien haavoittuvuudet
        run: npm audit --omit=dev --audit-level=high

      - name: Tyyppitarkistus
        run: npm run typecheck

      - name: Käännä
        run: npm run build

      - name: Testit
        run: npm test

      - name: Tarkista MCP-palvelin (mcp-doctor)
        if: matrix.node-version == 24
        uses: tonyweckstrom1987/mcp-doctor@6064a11717f76fb06ffd00b38b4e562d88573a26
        with:
          command: node dist/index.js
          smoke: smoke.json
          strict: "true"
